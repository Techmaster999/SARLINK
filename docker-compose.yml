services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pern-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: perndb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d perndb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      NODE_ENV: development
      PORT: 8888
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: pnpm run dev

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8889:8888"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 8888
      DATABASE_URL: postgres://myuser:[REDACTED]@postgres-db:5432/perndb
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
  client_node_modules:
