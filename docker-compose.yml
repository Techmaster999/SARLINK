services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pern-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: perndb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro   # NEW: creates tables on first start

  api-server:
    build:
      context: ./server            # CHANGED: build from the server folder (if the Dockerfile lives there)
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./server:/app              # Links your local server folder to the container
      - /app/node_modules          # Keeps container packages isolated
    env_file:
      - ./server/.env              # NEW: Google, session and other required vars
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://myuser:mypassword@postgres-db:5432/perndb   # overrides .env inside Docker
    depends_on:
      - postgres-db

volumes:
  postgres_data:
