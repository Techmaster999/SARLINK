services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pern-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: perndb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d perndb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/migrations/001_create_incidents.sql:/docker-entrypoint-initdb.d/001_create_incidents.sql:ro
      - ./server/db/seeds/dev_incidents.sql:/docker-entrypoint-initdb.d/002_dev_incidents.sql:ro

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      NODE_ENV: development
      PORT: 8888
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      api-server:
        condition: service_healthy
    command: pnpm run dev

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8889:8888"
    env_file:
      - ./server/.env
    volumes:
      - ./server/src:/app/src:ro
    environment:
      NODE_ENV: development
      PORT: 8888
      DATABASE_URL: postgres://myuser:mypassword@postgres-db:5432/perndb
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8888/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  client_node_modules:
